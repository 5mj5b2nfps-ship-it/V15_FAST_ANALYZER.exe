name: Build V15 Fast Analyzer EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install openpyxl
          python -m pip install pyinstaller

      - name: Build Windows EXE
        shell: powershell
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --name V15_FAST_ANALYZER `
            --collect-all openpyxl `
            V15_FAST_ANALYZER.py

      - name: Verify EXE
        shell: powershell
        run: |
          if (!(Test-Path "dist\V15_FAST_ANALYZER.exe")) {
            Write-Error "V15_FAST_ANALYZER.exe was not created"
            exit 1
          }

          Get-Item "dist\V15_FAST_ANALYZER.exe"
          Get-FileHash "dist\V15_FAST_ANALYZER.exe" -Algorithm SHA256

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: V15_FAST_ANALYZER_WINDOWS
          path: dist/V15_FAST_ANALYZER.exe
          retention-days: 7
          if-no-files-found: error
